<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple tip calculator app" />

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />

  <title>Tip calculator app</title>
</head>
<body>
  <main class="app-shell container-fluid">
    <header class="app-header">
      <img class="brand-logo" src="./images/logo.svg" alt="logo" />
    </header>

    <section class="calculator-card">
      <form class="calculator-form" id="tip-calculator-form">
        <div class="form-section bill-section">
          <div class="label-row">
            <label class="form-label" for="bill-input">Bill</label>
            <p class="error-message" id="bill-error">Can't be negative</p>
          </div>
          <div class="input-wrapper">
            <img class="input-icon" src="./images/icon-dollar.svg" />
            <input class="calculator-input" id="bill-input" name="bill" type="number" min="0" step="0.01" placeholder="0" />
          </div>
        </div>

        <div class="form-section tip-section">
          <div class="label-row">
            <p class="form-label">Select Tip %</p>
            <p class="error-message" id="tip-error">Can't be negative</p>
          </div>
          <div class="tip-grid">
            <input class="tip-button btn" id="tip-5" name="tip" type="button" value="5%" tip="5" />
            <input class="tip-button btn" id="tip-10" name="tip" type="button" value="10%" tip="10" />
            <input class="tip-button btn" id="tip-15" name="tip" type="button" value="15%" tip="15" />
            <input class="tip-button btn" id="tip-25" name="tip" type="button" value="25%" tip="25" />
            <input class="tip-button btn" id="tip-50" name="tip" type="button" value="50%" tip="50" />
            <input class="tip-button custom-tip-input" id="custom-tip" name="customTip" type="number" min="0" step="1" placeholder="Custom" />
          </div>
        </div>

        <div class="form-section people-section">
          <div class="label-row">
            <label class="form-label" for="people-input">Number of People</label>
            <p class="error-message" id="people-zero-error">Can't be zero</p>
            <p class="error-message" id="people-negative-error">Can't be negative</p>
            <p class="error-message" id="people-fraction-error">Must be a whole number</p>
          </div>
          <div class="input-wrapper">
            <img class="input-icon person-icon" src="./images/icon-person.svg" alt="person icon"/>
            <input class="calculator-input" id="people-input" name="people" type="number" min="1" step="1" placeholder="0" />
          </div>
        </div>
      </form>

      <aside class="results-panel">
        <div class="result-row">
          <div class="result-label">
            <p>Tip amount</p>
            <p class="result-subtitle">/ person</p>
          </div>
          <output class="result-value" id="tip-amount" name="tipAmount" for="bill-input tip-5 tip-10 tip-15 tip-25 tip-50 custom-tip people-input">$0.00</output>
        </div>

        <div class="result-row">
          <div class="result-label">
            <p>Total</p>
            <p class="result-subtitle">/ person</p>
          </div>
          <output class="result-value" id="total-amount" name="totalAmount" for="bill-input tip-5 tip-10 tip-15 tip-25 tip-50 custom-tip people-input">$0.00</output>
        </div>

        <input class="reset-button btn" id="reset-button" name="reset" type="reset" value="RESET" form="tip-calculator-form" />
      </aside>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
